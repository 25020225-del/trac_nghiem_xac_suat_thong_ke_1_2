<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ôn tập trắc nghiệm</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="typeset()"></script>
<style>
:root{
  --bg:#eef2f5;--panel:#ffffff;--soft:#f5f8fa;--text:#1b2733;--muted:#66778a;
  --accent:#1f5f99;--accent-ink:#fff;--accent-soft:rgba(31,95,153,.10);
  --border:#d9e1e8;--ok:#2b7a56;--ok-soft:rgba(43,122,86,.12);
  --bad:#b8433f;--bad-soft:rgba(184,67,63,.12);--shadow:0 1px 2px rgba(20,40,60,.06),0 8px 24px rgba(20,40,60,.06);
  --r:14px;
}
[data-theme=dark]{
  --bg:#0f151b;--panel:#171f27;--soft:#1d2731;--text:#e6edf3;--muted:#8fa1b3;
  --accent:#6cb0ee;--accent-ink:#0b1722;--accent-soft:rgba(108,176,238,.14);
  --border:#2a3743;--ok:#52b788;--ok-soft:rgba(82,183,136,.15);
  --bad:#e57873;--bad-soft:rgba(229,120,115,.15);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* Header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top)}
.bar{max-width:1120px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:1.15rem;letter-spacing:-.01em}
.brand small{color:var(--muted)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctl label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.9rem}
select,.btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);transition:background .15s,border-color .15s}
select{max-width:220px}
.btn:hover,select:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.only-mobile{display:none}

/* Layout */
.layout{max-width:1120px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.notice{max-width:1120px;margin:12px auto 0;padding:0 16px}
.notice div{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:var(--r);
  background:var(--accent-soft);border:1px solid var(--accent)}
.notice button{background:none;border:0;font-size:1.2rem;line-height:1;color:var(--muted)}

/* Main */
.meter{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.meter b{font-size:1.05rem}
.progress{height:8px;background:var(--border);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:26px;margin-top:16px}
.topic{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:.88rem;font-weight:600}
.question{font-size:1.2rem;font-weight:600;line-height:1.6;margin:16px 0 20px;white-space:pre-wrap;overflow-wrap:anywhere}
.answers{display:grid;gap:10px}
.answer{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:14px 16px;border-radius:12px;
  border:1.5px solid var(--border);background:var(--soft);transition:border-color .15s,background .15s}
.answer:hover:not(:disabled){border-color:var(--accent)}
.answer .letter{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;
  background:var(--panel);border:1.5px solid var(--border)}
.answer .txt{padding-top:2px;overflow-wrap:anywhere;white-space:pre-wrap}
.answer.selected{border-color:var(--accent);background:var(--accent-soft)}
.answer.selected .letter{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.answer.correct{border-color:var(--ok);background:var(--ok-soft)}
.answer.correct .letter{background:var(--ok);border-color:var(--ok);color:#fff}
.answer.wrong{border-color:var(--bad);background:var(--bad-soft)}
.answer.wrong .letter{background:var(--bad);border-color:var(--bad);color:#fff}
.answer:disabled{cursor:default;color:inherit}
.feedback{margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--soft);border-left:4px solid var(--accent);white-space:pre-wrap;overflow-wrap:anywhere}
.feedback.ok{border-left-color:var(--ok)}
.feedback.bad{border-left-color:var(--bad)}
.feedback strong{display:block;margin-bottom:4px}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}
.actions .grp{display:flex;gap:10px;flex-wrap:wrap}
.hint{margin-top:12px;font-size:.85rem;color:var(--muted)}

/* Bảng trong câu hỏi */
.tbl{overflow-x:auto;margin:10px 0;max-width:100%}
.tbl table{border-collapse:collapse;white-space:normal;font-weight:400;min-width:50%}
.tbl th,.tbl td{border:1px solid var(--border);padding:7px 14px}
.tbl th{background:var(--soft);font-weight:600}

/* Summary */
.summary h2{margin:0 0 6px}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.sumgrid div{padding:14px;border-radius:12px;background:var(--soft);text-align:center}
.sumgrid b{display:block;font-size:1.6rem}

/* Palette */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:18px;position:sticky;top:88px;
  max-height:calc(100vh - 104px);overflow:auto}
.panel h2{margin:0 0 10px;font-size:1rem}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.legend div{padding:8px;border-radius:10px;background:var(--soft);text-align:center;font-size:.82rem;color:var(--muted)}
.legend b{display:block;font-size:1.15rem;color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--border);background:var(--panel);font-size:.85rem}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.cell{height:40px;border-radius:10px;border:1.5px solid var(--border);background:var(--soft);font-weight:600;font-size:.88rem;padding:0}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2.5px solid var(--accent);outline-offset:1px}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.panel .close{display:none}
.overlay{display:none}

/* Mobile */
@media(max-width:899px){
  .layout{grid-template-columns:1fr;padding:12px}
  .only-mobile{display:inline-block}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;border-radius:20px 20px 0 0;max-height:78vh;
    transform:translateY(105%);transition:transform .25s;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .panel.open{transform:none}
  .panel .close{display:block;float:right;padding:4px 10px}
  .overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
}
@media(max-width:600px){
  .bar{padding:10px 12px}
  .ctl{width:100%}
  .ctl label{flex:1 1 auto}
  .ctl label select{flex:1;max-width:none;min-width:0}
  .card{padding:18px;border-radius:16px}
  .question{font-size:1.08rem}
  .actions{position:sticky;bottom:0;background:var(--panel);padding:12px 0 4px;margin-bottom:-4px}
  .actions .grp{flex:1;justify-content:flex-end}
  .hint{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><h1>Ôn tập trắc nghiệm</h1><small id="sub">Đang tải dữ liệu</small></div>
    <div class="ctl">
      <label>Chế độ
        <select id="mode"><option value="random">Ngẫu nhiên</option><option value="seq">Từ trên xuống</option></select>
      </label>
      <label>Chủ đề
        <select id="filter"><option value="all">Tất cả</option></select>
      </label>
      <button class="btn only-mobile" id="openList">Danh sách câu</button>
      <button class="btn" id="restart">Làm lại</button>
      <button class="btn" id="theme" aria-label="Đổi giao diện sáng/tối">Tối</button>
    </div>
  </div>
</header>

<div class="notice hidden" id="notice"><div><span id="noticeText"></span><button id="noticeClose" aria-label="Đóng">×</button></div></div>

<div class="layout">
  <main>
    <div id="loading" class="card">Đang tải <code>data.csv</code>...</div>

    <section id="quiz" class="hidden">
      <div class="meter"><span id="counter" class="muted"></span><b id="score"></b></div>
      <div class="progress"><i id="bar"></i></div>

      <article class="card" id="qcard">
        <span class="topic" id="topic"></span>
        <div class="question" id="question"></div>
        <div class="answers" id="answers"></div>
        <div class="feedback hidden" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="prev">Câu trước</button>
          <div class="grp">
            <button class="btn" id="skip">Bỏ qua</button>
            <button class="btn primary" id="check">Kiểm tra</button>
            <button class="btn primary hidden" id="next">Câu tiếp</button>
          </div>
        </div>
        <div class="hint">Phím tắt: A–D chọn đáp án, Enter kiểm tra hoặc sang câu tiếp, phím mũi tên trái/phải để chuyển câu.</div>
      </article>

      <article class="card summary hidden" id="summary"></article>
    </section>
  </main>

  <aside class="panel" id="panel" aria-label="Danh sách câu hỏi">
    <button class="btn close" id="closeList">Đóng</button>
    <h2>Danh sách câu hỏi</h2>
    <div class="legend">
      <div><b id="nTodo">0</b>Chưa làm</div>
      <div><b id="nOk" style="color:var(--ok)">0</b>Đúng</div>
      <div><b id="nBad" style="color:var(--bad)">0</b>Sai</div>
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-f="all" aria-pressed="true">Tất cả</button>
      <button class="chip" data-f="todo" aria-pressed="false">Chưa làm</button>
      <button class="chip" data-f="ok" aria-pressed="false">Đúng</button>
      <button class="chip" data-f="bad" aria-pressed="false">Sai</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty hidden" id="gridEmpty">Không có câu nào trong nhóm này.</div>
  </aside>
</div>
<div class="overlay" id="overlay"></div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'quiz_state_v2', TKEY = 'quiz_theme';
const REQ = ['question','topic','answer_A','answer_B','answer_C','answer_D','correct_answer','reason'];
const LET = ['A','B','C','D'];

let data = [], S = null, csvHash = '', palFilter = 'all';

/* ---------- Tiện ích ---------- */
function hashText(str){                       // cyrb53: đủ nhanh, không cần HTTPS
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36) + ':' + str.length;
}
function parseCSV(t){
  t = t.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){
      if (c === '"' && t[i+1] === '"'){ f += '"'; i++; }
      else if (c === '"') q = false;
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { r.push(f); f = ''; }
    else if (c === '\n') { r.push(f); rows.push(r); r = []; f = ''; }
    else f += c;
  }
  if (f || r.length){ r.push(f); rows.push(r); }
  const h = rows.shift().map(x => x.trim());
  const miss = REQ.filter(x => !h.includes(x));
  if (miss.length) throw Error('Thiếu cột: ' + miss.join(', '));
  return rows.filter(x => x.some(v => v.trim()))
             .map(x => Object.fromEntries(h.map((k,i) => [k, (x[i] || '').trim()])));
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){ for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function fmt(s){                              // escape + chuyển bảng markdown thành <table>
  const lines = esc(s).split('\n');
  const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  const isRow = l => /^\s*\|/.test(l);
  const isSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  let out = '', i = 0;
  while (i < lines.length){
    if (isRow(lines[i]) && i + 1 < lines.length && isSep(lines[i+1])){
      const head = cells(lines[i]);
      const al = cells(lines[i+1]).map(c => c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : 'left');
      const td = (tag, c, k) => '<' + tag + ' style="text-align:' + (al[k] || 'left') + '">' + c + '</' + tag + '>';
      let h = '<div class="tbl"><table><thead><tr>' + head.map((c,k) => td('th', c, k)).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && isRow(lines[i])){
        h += '<tr>' + cells(lines[i]).map((c,k) => td('td', c, k)).join('') + '</tr>'; i++;
      }
      out += h + '</tbody></table></div>';
    } else { out += lines[i] + (i < lines.length - 1 ? '\n' : ''); i++; }
  }
  return out;
}
const norm = v => String(v).trim().toUpperCase().replace(/^ANSWER[_\s-]?/, '').charAt(0);
const rightOf = id => norm(data[id].correct_answer);
const topicOf = x => x.topic || 'Không có chủ đề';

/* ---------- Lưu trữ ---------- */
function loadSaved(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function freshState(){ return { hash: csvHash, mode: 'random', filter: 'all', order: [], pos: 0, answers: {} }; }
function validSaved(s){
  return s && s.hash === csvHash && Array.isArray(s.order) && s.answers && typeof s.answers === 'object'
    && s.order.every(i => Number.isInteger(i) && i >= 0 && i < data.length) && Number.isInteger(s.pos);
}
function showNotice(msg){ $('noticeText').textContent = msg; $('notice').classList.remove('hidden'); }

/* ---------- Trạng thái câu hỏi ---------- */
function stateOf(id){
  const a = S.answers[id];
  if (!a || !a.checked) return 'todo';
  return a.sel === rightOf(id) ? 'ok' : 'bad';
}
function counts(){
  const c = { todo: 0, ok: 0, bad: 0 };
  S.order.forEach(id => c[stateOf(id)]++);
  return c;
}
function buildOrder(){
  let ids = data.map((_, i) => i).filter(i => S.filter === 'all' || topicOf(data[i]) === S.filter);
  if (S.mode === 'random') shuffle(ids);
  S.order = ids; S.pos = 0;
}

/* ---------- Render ---------- */
function renderStats(){
  const c = counts(), total = S.order.length, done = c.ok + c.bad;
  $('nTodo').textContent = c.todo; $('nOk').textContent = c.ok; $('nBad').textContent = c.bad;
  $('score').textContent = 'Đúng ' + c.ok + '/' + done + ' câu đã làm';
  $('bar').style.width = (total ? done / total * 100 : 0) + '%';
  $('sub').textContent = 'Đã làm ' + done + '/' + total + ' câu';
}
function renderPalette(){
  const grid = $('grid'); let html = '', shown = 0;
  S.order.forEach((id, i) => {
    const st = stateOf(id);
    if (palFilter !== 'all' && palFilter !== st) return;
    shown++;
    html += '<button class="cell ' + st + (i === S.pos ? ' cur' : '') + '" data-i="' + i + '" title="' +
      esc(data[id].question.slice(0, 80)) + '" aria-label="Câu ' + (i+1) + '">' + (i+1) + '</button>';
  });
  grid.innerHTML = html;
  $('gridEmpty').classList.toggle('hidden', shown > 0);
  const cur = grid.querySelector('.cur'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
}
function renderQuestion(){
  const total = S.order.length;
  if (!total){ $('qcard').classList.add('hidden'); $('summary').classList.add('hidden');
    $('counter').textContent = 'Không có câu hỏi'; return; }
  if (S.pos >= total){ renderSummary(); return; }

  $('summary').classList.add('hidden'); $('qcard').classList.remove('hidden');
  const id = S.order[S.pos], x = data[id], a = S.answers[id] || {}, right = rightOf(id), done = !!a.checked;
  $('counter').textContent = 'Câu ' + (S.pos + 1) + ' / ' + total;
  $('topic').textContent = topicOf(x);
  $('question').innerHTML = fmt(x.question);
  $('answers').innerHTML = LET.map(l => {
    let cls = 'answer';
    if (done){ if (l === right) cls += ' correct'; else if (l === a.sel) cls += ' wrong'; }
    else if (a.sel === l) cls += ' selected';
    return '<button class="' + cls + '" data-l="' + l + '"' + (done ? ' disabled' : '') + '><span class="letter">' + l +
      '</span><span class="txt">' + fmt(x['answer_' + l]) + '</span></button>';
  }).join('');

  const fb = $('feedback');
  if (done){
    const ok = a.sel === right;
    fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
    fb.innerHTML = '<strong>' + (ok ? 'Chính xác' : 'Chưa đúng, đáp án đúng là ' + esc(right)) + '</strong>' +
      (x.reason ? 'Giải thích: ' + fmt(x.reason) : '');
  } else fb.className = 'feedback hidden';

  $('check').classList.toggle('hidden', done);
  $('skip').classList.toggle('hidden', done);
  $('next').classList.toggle('hidden', !done);
  $('prev').disabled = S.pos === 0;
  typeset();
}
function typeset(){
  if (!window.renderMathInElement || !S || $('qcard').classList.contains('hidden')) return;
  renderMathInElement($('qcard'), {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '\\[', right: '\\]', display: true },
      { left: '\\(', right: '\\)', display: false },
      { left: '$', right: '$', display: false }
    ],
    throwOnError: false
  });
}
function renderSummary(){
  const c = counts(), total = S.order.length, done = c.ok + c.bad;
  $('qcard').classList.add('hidden');
  const s = $('summary'); s.classList.remove('hidden');
  $('counter').textContent = 'Kết quả';
  const pct = done ? Math.round(c.ok / done * 100) : 0;
  s.innerHTML = '<h2>' + (c.todo ? 'Bạn đã đi hết danh sách' : 'Hoàn thành') + '</h2>' +
    '<div class="muted">Đúng ' + c.ok + '/' + done + ' câu đã làm (' + pct + '%)</div>' +
    '<div class="sumgrid"><div><b>' + c.todo + '</b>Chưa làm</div><div><b style="color:var(--ok)">' + c.ok +
    '</b>Đúng</div><div><b style="color:var(--bad)">' + c.bad + '</b>Sai</div></div>' +
    '<div class="actions" style="margin-top:0"><button class="btn" id="sPrev">Xem lại câu cuối</button><div class="grp">' +
    (c.todo ? '<button class="btn primary" id="sTodo">Làm câu chưa làm</button>' : '') +
    (c.bad ? '<button class="btn primary" id="sBad">Làm lại câu sai</button>' : '') +
    '<button class="btn" id="sAll">Làm lại tất cả</button></div></div>';
  $('sPrev').onclick = () => go(total - 1);
  if ($('sTodo')) $('sTodo').onclick = () => goFirst('todo');
  if ($('sBad')) $('sBad').onclick = () => { S.order.forEach(id => { if (stateOf(id) === 'bad') delete S.answers[id]; }); goFirst('todo'); };
  $('sAll').onclick = restart;
}
function render(){ renderStats(); renderPalette(); renderQuestion(); }

/* ---------- Điều hướng & hành động ---------- */
function go(p){ S.pos = Math.max(0, Math.min(p, S.order.length)); save(); render(); closeList(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function goFirst(st){ const i = S.order.findIndex(id => stateOf(id) === st); go(i < 0 ? 0 : i); }
function curId(){ return S.order[S.pos]; }
function select(l){
  const id = curId(); if (id === undefined) return;
  const a = S.answers[id];
  if (a && a.checked) return;
  S.answers[id] = { sel: l, checked: false };
  save(); renderQuestion();
}
function check(){
  const id = curId(), a = S.answers[id];
  if (!a || !a.sel) return alert('Hãy chọn một đáp án.');
  a.checked = true; save(); render();
}
function restart(){
  const n = S.order.filter(id => S.answers[id]).length;
  if (n && !confirm('Xóa tiến độ của ' + S.order.length + ' câu đang hiển thị và làm lại?')) return;
  S.order.forEach(id => delete S.answers[id]);
  buildOrder(); save(); render();
}
function openList(){ $('panel').classList.add('open'); $('overlay').classList.add('show'); }
function closeList(){ $('panel').classList.remove('open'); $('overlay').classList.remove('show'); }

/* ---------- Sự kiện ---------- */
$('answers').onclick = e => { const b = e.target.closest('.answer'); if (b){ select(b.dataset.l); } };
$('check').onclick = check;
$('next').onclick = () => go(S.pos + 1);
$('skip').onclick = () => go(S.pos + 1);
$('prev').onclick = () => go(S.pos - 1);
$('grid').onclick = e => { const b = e.target.closest('.cell'); if (b) go(+b.dataset.i); };
$('chips').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  palFilter = b.dataset.f;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
  renderPalette();
};
$('restart').onclick = restart;
$('mode').onchange = () => { S.mode = $('mode').value; buildOrder(); save(); render(); };
$('filter').onchange = () => { S.filter = $('filter').value; buildOrder(); save(); render(); };
$('openList').onclick = openList; $('closeList').onclick = closeList; $('overlay').onclick = closeList;
$('noticeClose').onclick = () => $('notice').classList.add('hidden');
document.addEventListener('keydown', e => {
  if (!S || !data.length || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.matches('select')) return;
  const k = e.key.toUpperCase();
  if ('ABCD'.includes(k) && k.length === 1) select(k);
  else if (e.key === 'Enter' && e.target.tagName !== 'BUTTON'){
    const id = curId(), a = S.answers[id];
    if (a && a.checked) go(S.pos + 1); else if (a && a.sel) check();
  }
  else if (e.key === 'ArrowRight') go(S.pos + 1);
  else if (e.key === 'ArrowLeft') go(S.pos - 1);
  else if (e.key === 'Escape') closeList();
});

/* ---------- Giao diện sáng/tối (không bị reset khi data.csv đổi) ---------- */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $('theme').textContent = t === 'dark' ? 'Sáng' : 'Tối';
  try { localStorage.setItem(TKEY, t); } catch {}
}
let t0 = null; try { t0 = localStorage.getItem(TKEY); } catch {}
setTheme(t0 || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

/* ---------- Khởi động ---------- */
fetch('./data.csv', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw Error('Không tìm thấy data.csv'); return r.text(); })
  .then(text => {
    csvHash = hashText(text);
    data = parseCSV(text);
    if (!data.length) throw Error('data.csv không có câu hỏi nào');

    const saved = loadSaved();
    if (validSaved(saved)) S = saved;
    else {
      if (saved && saved.hash !== csvHash) showNotice('data.csv đã thay đổi nên tiến độ cũ đã được xóa.');
      S = freshState();
    }
    const topics = [...new Set(data.map(topicOf))];
    if (S.filter !== 'all' && !topics.includes(S.filter)) S.filter = 'all';
    $('filter').innerHTML = '<option value="all">Tất cả</option>' + topics.map(x => '<option value="' + esc(x) + '">' + esc(x) + '</option>').join('');
    $('filter').value = S.filter; $('mode').value = S.mode;
    if (!S.order.length) buildOrder();
    S.pos = Math.max(0, Math.min(S.pos, S.order.length));
    save();

    $('loading').classList.add('hidden'); $('quiz').classList.remove('hidden');
    render();
  })
  .catch(e => {
    $('sub').textContent = 'Lỗi';
    $('loading').innerHTML = '<h2>Không thể tải dữ liệu</h2><p>' + esc(e.message) +
      '</p><p class="muted">Đặt index.html và data.csv cùng thư mục, rồi chạy bằng local server (ví dụ <code>python -m http.server</code>).</p>';
  });
</script>
</body>
</html>
